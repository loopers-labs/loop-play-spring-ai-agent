# ============================================================
# jdbc 프로필 — Chat Memory 를 PgVector 의 PostgreSQL 에 영속화 (단일 DB 통합)
# ============================================================
# 사용법:
#   ./gradlew bootRun --args='--spring.profiles.active=jdbc'
#
# Round 3 는 이 프로필에서 h2:file 에 대화를 저장했지만, Round 4 는 PgVector 가 띄운
# PostgreSQL(localhost:5432/baedal)을 그대로 공유한다. 결과적으로 한 인스턴스에
#   - vector_store            (RAG 검색용 청크/임베딩)
#   - SPRING_AI_CHAT_MEMORY   (세션별 대화 이력)
# 가 함께 산다. JdbcChatMemoryExample 의 "4주차에서 PgVector 동일 DB 공유" 메모를 실제로 구현한 것.
#
# datasource / ollama / embedding / vectorstore 설정은 base application.yml 에서 상속한다.
# 이 프로필이 base 와 다른 것은 아래 두 가지뿐:
#   1) JdbcChatMemoryRepositoryAutoConfiguration 을 다시 켠다 (base 가 exclude 한 것을 [] 로 덮어씀)
#   2) Chat Memory 스키마 자동 초기화 (SPRING_AI_CHAT_MEMORY 테이블 생성)
# 그러면 ChatMemoryConfig 의 InMemory 빈(@Profile("!jdbc"))은 빠지고
# 자동 구성된 JdbcChatMemoryRepository 가 주입된다.
# ============================================================

spring:
  # base application.yml 이 exclude 한 JdbcChatMemoryRepositoryAutoConfiguration 을 jdbc 프로필에선 다시 켠다.
  # (profile-specific 문서가 base 의 list 를 빈 리스트로 대체)
  autoconfigure:
    exclude: []
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # 실제 PostgreSQL 이므로 jar 의 schema-postgresql.sql 이 그대로 쓰인다
            # (Round 3 H2 처럼 platform 을 우회로 강제할 필요가 없지만, 명시로 둔다).
            # CREATE TABLE IF NOT EXISTS 라 재시작 시 중복 생성/데이터 손실 없음 → always.
            initialize-schema: always
            platform: postgresql
