# ============================================================
# 3주차 — JDBC Chat Memory 대안 프로필 (옵션)
# ============================================================
# 사용법:
#   ./gradlew bootRun --args='--spring.profiles.active=jdbc'
#
# 이 프로필을 실제로 활성화하려면 build.gradle에 아래 의존성을 추가해야 한다.
#
#   implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
#   runtimeOnly    'com.h2database:h2'
#
# 또한 ChatMemoryConfig의 `chatMemoryRepository()` Bean을 주석 처리하거나
# @Profile("!jdbc")로 한정해야 자동 구성된 JdbcChatMemoryRepository가 주입된다.
# (Spring AI 1.0: starter-model-chat-memory-repository-jdbc가 자동으로
#  JdbcChatMemoryRepository를 등록한다)
#
# 강의 노트의 "InMemory vs JDBC 비교" 섹션을 참고하라.
# ============================================================

spring:
  application:
    name: baedal-support-agent
  # 기본 application.yml 이 제외한 DataSource·Jdbc 자동구성을 jdbc 프로필에선 다시 켠다.
  # (profile-specific 문서가 base 의 list 를 빈 리스트로 대체)
  autoconfigure:
    exclude: []
  datasource:
    # ⚠️ 재시작 실험 핵심: h2:mem 은 JVM 재시작 시 DB 도 사라져 InMemory 와 차이가 없다.
    # 영속성을 보려면 h2:file 이어야 한다 (디스크에 ./data/baedal.mv.db 로 남음).
    url: jdbc:h2:file:./data/baedal;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5
        options:
          temperature: 0.3
    # Spring AI 1.0은 JdbcChatMemoryRepository 사용 시 다음 속성으로
    # 스키마 자동 초기화 방식을 지정할 수 있다.
    chat:
      memory:
        repository:
          jdbc:
            # ⚠️ embedded 는 "in-memory DB 일 때만 init" 이라 h2:file 에선 테이블이 안 만들어진다
            # (Spring 의 embedded 판정에 file H2 는 미포함). file 영속을 쓰므로 always 로 강제.
            # CREATE TABLE IF NOT EXISTS 라 재시작 때 중복 생성/데이터 손실 없음.
            initialize-schema: always   # always / never / embedded
            # ⚠️ Spring AI 1.0.0 jdbc jar 에는 schema-h2.sql 이 없다 (postgresql/sqlserver/hsqldb/mariadb 만).
            # H2 를 MODE=PostgreSQL 로 띄웠으므로 platform 을 postgresql 로 강제해
            # schema-postgresql.sql 을 사용한다. 해당 DDL 은 H2 와 호환된다.
            platform: postgresql

logging:
  level:
    org.springframework.ai: DEBUG
