spring:
  application:
    name: baedal-support-agent
  profiles:
    active: dev
  # 기본(dev 등 비-jdbc) 프로필에서는 JDBC Chat Memory 자동 구성을 끈다.
  # (H2가 클래스패스에 있어 DataSource가 자동 구성되면 jdbcChatMemoryRepository가
  #  등록되어 InMemory 빈과 충돌하고, dev엔 platform 설정이 없어 schema 초기화도 실패한다.)
  # jdbc 프로필에서는 application-jdbc.yml 이 exclude 를 비워 다시 켠다.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration

  # -------------------------------------------------------------------
  # 4주차 — PgVector 연결 (docker-compose.yml 참조)
  #   db: baedal / user: baedal / password: baedal / port: 5432
  # -------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/baedal
    username: baedal
    password: baedal
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:14b
#        model: llama3.1
        options:
          temperature: 0.3
      # 임베딩 모델을 Ollama로 통일한다.
      # 사용 전: ollama pull qwen3-embedding:0.6b
      embedding:
        model: qwen3-embedding:0.6b

    # -------------------------------------------------------------------
    # 4주차 — PgVector 설정
    #   initialize-schema=true 이면 Spring AI가 앱 기동 시 자동으로
    #   vector_store 테이블과 확장(vector, uuid-ossp, hstore)을 생성한다.
    #   dimensions는 임베딩 모델 차원과 반드시 일치해야 한다:
    #     - qwen3-embedding:0.6b → 1024
    #     - nomic-embed-text → 768
    # -------------------------------------------------------------------
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        # 스키마/테이블명 기본값 사용 (public.vector_store)
