name: Co-change Check

on:
  push:
    branches: ['**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  co-change-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: OrderTools.java 변경 시 OrderToolsTest.java 동반 수정 확인
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff HEAD~1 --name-only)
          else
            CHANGED=$(git show --name-only --format="" HEAD)
          fi

          IMPL_FILES=$(echo "$CHANGED" | grep -v Test)
          TOOLS_CHANGED=$(echo "$IMPL_FILES" | grep -c "OrderTools\.java" || true)
          TEST_CHANGED=$(echo "$CHANGED" | grep -c "OrderToolsTest\.java" || true)

          if [ "$TOOLS_CHANGED" -gt 0 ] && [ "$TEST_CHANGED" -eq 0 ]; then
            echo "❌ OrderTools.java가 변경됐지만 OrderToolsTest.java는 변경되지 않았습니다."
            echo "Tool description을 변경했다면 Contract Test도 함께 수정해주세요."
            echo "(CLAUDE.md: '@Tool(description) 변경 시 Contract Test 동반 수정' 규칙)"
            exit 1
          fi

          echo "✅ co-change 체크 통과"
